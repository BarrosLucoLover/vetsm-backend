# ---------- Perfil "oracle": Oracle Autonomous Database en OCI ----------
# Cada microservicio usa su propio usuario (esquema) de Oracle: sus tablas no las ve ningún otro servicio.
# Todos los datos sensibles llegan por variables de entorno (ver .env.example). Nunca escribirlos aquí.
# Conexion con el wallet de Oracle (carpeta wallet/ del proyecto, montada en /wallet por Docker).
# ORACLE_SERVICIO es un nombre de tnsnames.ora del wallet, por ejemplo vetsm_tp.
# DB_URL permite escribir la URL JDBC completa si se necesita otra forma de conexion.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@${ORACLE_SERVICIO:vetsm_tp}?TNS_ADMIN=${ORACLE_WALLET:/wallet}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# La capa gratuita de OCI permite pocas conexiones simultáneas.
spring.datasource.hikari.maximum-pool-size=3
# Renueva las conexiones antes de que Oracle o la red corten las que quedan inactivas.
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
# La primera conexion a la nube puede tardar: se espera hasta 60 segundos.
spring.datasource.hikari.connection-timeout=60000

spring.h2.console.enabled=false

# Secreto para firmar y verificar los JWT (al menos 32 caracteres), el mismo en los cuatro servicios.
app.jwt.secreto=${JWT_SECRET}
