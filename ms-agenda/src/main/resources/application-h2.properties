# ---------- Perfil "h2": desarrollo local y pruebas ----------
# Base en memoria PROPIA de este servicio, en modo compatible con Oracle. Se borra al apagarlo.
spring.datasource.url=jdbc:h2:mem:agenda;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola web de H2 en http://localhost:8084/h2-console (solo en este perfil).
spring.h2.console.enabled=true

# Secreto de DESARROLLO para los JWT; debe ser el mismo en los cuatro servicios.
# En el perfil "oracle" se usa la variable JWT_SECRET.
app.jwt.secreto=solo-para-desarrollo-local-cambiar-en-produccion-2026

# Mascotas y citas de demostración de la clienta Ana García (id 3 en ms-usuarios).
app.seed.demo=true
