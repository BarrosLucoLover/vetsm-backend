# API Gateway de la Veterinaria San Marcos (Nginx).
#
# Es la única puerta de entrada al backend: el navegador solo conoce http://localhost:8080 y el
# gateway reparte cada petición al microservicio que corresponde según la ruta. Los servicios no
# publican sus puertos fuera de la red de Docker, y las rutas internas (/internal/...) no se
# enrutan: desde afuera no se pueden alcanzar.

server {
    listen 8080;

    # DNS interno de Docker: vuelve a buscar la dirección de cada servicio si su contenedor se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 2m;

    set $ms_usuarios http://ms-usuarios:8081;
    set $ms_catalogo http://ms-catalogo:8082;
    set $ms_ventas   http://ms-ventas:8083;
    set $ms_agenda   http://ms-agenda:8084;

    # El Host original se conserva: así las cabeceras Location y Swagger usan la dirección pública.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- ms-usuarios: cuentas, sesión y perfil ----------
    location /api/v1/auth/            { proxy_pass $ms_usuarios; }
    location /api/v1/perfil           { proxy_pass $ms_usuarios; }
    location /api/v1/usuarios         { proxy_pass $ms_usuarios; }
    location /api/v1/reportes/usuarios { proxy_pass $ms_usuarios; }

    # ---------- ms-catalogo: categorías, productos e inventario ----------
    location /api/v1/categorias        { proxy_pass $ms_catalogo; }
    location /api/v1/productos         { proxy_pass $ms_catalogo; }
    location /api/v1/reportes/inventario { proxy_pass $ms_catalogo; }

    # ---------- ms-ventas: compras, pagos y tarjetas ----------
    location /api/v1/boletas          { proxy_pass $ms_ventas; }
    location /api/v1/tarjetas         { proxy_pass $ms_ventas; }
    location /api/v1/reportes/ventas  { proxy_pass $ms_ventas; }

    # ---------- ms-agenda: citas y mascotas ----------
    location /api/v1/citas            { proxy_pass $ms_agenda; }
    location /api/v1/mascotas         { proxy_pass $ms_agenda; }
    location /api/v1/reportes/citas   { proxy_pass $ms_agenda; }

    # ---------- Swagger: una sola página con un selector para los cuatro servicios ----------
    location /swagger-ui              { proxy_pass $ms_usuarios; }
    location /v3/api-docs/usuarios    { proxy_pass $ms_usuarios; }
    location /v3/api-docs/catalogo    { proxy_pass $ms_catalogo; }
    location /v3/api-docs/ventas      { proxy_pass $ms_ventas; }
    location /v3/api-docs/agenda      { proxy_pass $ms_agenda; }

    # Para comprobar que el gateway está arriba.
    location = /salud {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cualquier otra ruta (incluidas las internas) no existe para el exterior.
    location / {
        default_type application/json;
        return 404 '{"status":404,"error":"Not Found","mensaje":"La ruta no existe en la API.","ruta":"$uri","errores":null}';
    }
}
