spring.application.name=ms-ventas
# Puerto propio de este microservicio. En Docker todos quedan detrás del gateway (puerto 8080).
server.port=${PORT:8083}

# Perfil por defecto: H2 en memoria (una base propia para este servicio).
# Con Oracle: SPRING_PROFILES_ACTIVE=oracle (ver application-oracle.properties y .env.example).
spring.profiles.default=h2

# Las consultas a la base se hacen dentro de los servicios, no al armar la respuesta JSON.
spring.jpa.open-in-view=false

# Hora de Chile (el servidor en la nube suele estar en UTC).
app.zona-horaria=America/Santiago

# ---------- JWT ----------
# Todos los servicios verifican el mismo token: mismo emisor y mismo secreto (app.jwt.secreto, por perfil).
app.jwt.emisor=vetsm-backend

# ---------- CORS (solo para llamadas directas; el navegador normalmente pasa por el gateway) ----------
app.cors.origenes=${CORS_ORIGENES:http://localhost:3000,http://localhost:5173}

# ---------- Otros microservicios que llama este servicio ----------
app.servicios.catalogo=${CATALOGO_URL:http://localhost:8082}

# ---------- Swagger / OpenAPI ----------
# Por el gateway: http://localhost:8080/swagger-ui.html (todos los servicios en una página).
# Directo: http://localhost:8083/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs/ventas
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json
# Solo se documenta la API pública; los endpoints internos (/internal/...) no aparecen.
springdoc.paths-to-match=/api/**
app.documentacion.titulo=ms-ventas: compras y pagos
app.documentacion.descripcion=Compras de la tienda (boletas), pago con tarjeta **simulado** y tarjetas guardadas.
