# ---------- Perfil "oracle": Oracle Autonomous Database en OCI ----------
# Todos los datos sensibles llegan por variables de entorno (ver .env.example).
# Nunca escribir aquí usuarios, contraseñas ni la ruta del wallet.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# La capa gratuita de OCI permite pocas conexiones simultáneas.
spring.datasource.hikari.maximum-pool-size=5

spring.h2.console.enabled=false

# Secreto para firmar los JWT (al menos 32 caracteres). Sin esta variable la aplicación no arranca.
app.jwt.secreto=${JWT_SECRET}

# Contraseñas de las cuentas iniciales del personal. Si no se definen, esas cuentas no se crean.
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.recepcion-password=${SEED_RECEPCION_PASSWORD:}
