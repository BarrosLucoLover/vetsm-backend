spring.application.name=vetsm-backend
server.port=8080

# Perfil por defecto: H2 en memoria, para desarrollar sin depender de la nube.
# Para usar la base Oracle (OCI) se arranca con el perfil "oracle":
#   SPRING_PROFILES_ACTIVE=oracle  (ver application-oracle.properties y .env.example)
spring.profiles.default=h2

# Las consultas a la base se hacen dentro de los servicios, no al armar la respuesta JSON.
spring.jpa.open-in-view=false
