spring.application.name=vetsm-backend
server.port=8080

# Perfil por defecto: H2 en memoria, para desarrollar sin depender de la nube.
# Para usar la base Oracle (OCI) se arranca con el perfil "oracle":
#   SPRING_PROFILES_ACTIVE=oracle  (ver application-oracle.properties y .env.example)
spring.profiles.default=h2

# Las consultas a la base se hacen dentro de los servicios, no al armar la respuesta JSON.
spring.jpa.open-in-view=false

# Hora de Chile para la agenda (el servidor en la nube suele estar en UTC).
app.zona-horaria=America/Santiago

# ---------- Swagger / OpenAPI ----------
# Swagger UI: http://localhost:8080/swagger-ui.html  ·  Especificación: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json
springdoc.paths-to-match=/api/**
