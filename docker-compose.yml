# Levanta todo el backend con un solo comando:   docker compose up --build
# Gateway en http://localhost:8080  ·  Swagger en http://localhost:8080/swagger-ui.html
#
# Por defecto cada servicio usa su propia base H2 en memoria (perfil h2). Para Oracle, copiar
# .env.example a .env, completar los datos y poner PERFIL=oracle.

name: vetsm

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootVetsm2026!}
      MYSQL_USER: vetsm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-VetsmDb2026!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootVetsm2026!}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-usuarios:
    build:
      context: .
      args:
        MODULO: ms-usuarios
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${PERFIL:-h2}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_COOKIE_SEGURA: ${JWT_COOKIE_SEGURA:-false}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:3000,http://localhost:5173}
      DB_URL: ${USUARIOS_DB_URL:-}
      DB_USER: ${USUARIOS_DB_USER:-}
      DB_PASSWORD: ${USUARIOS_DB_PASSWORD:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_RECEPCION_PASSWORD: ${SEED_RECEPCION_PASSWORD:-}
      VENTAS_URL: http://ms-ventas:8083
      AGENDA_URL: http://ms-agenda:8084

  ms-catalogo:
    build:
      context: .
      args:
        MODULO: ms-catalogo
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${PERFIL:-h2}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:3000,http://localhost:5173}
      DB_URL: ${CATALOGO_DB_URL:-}
      DB_USER: ${CATALOGO_DB_USER:-}
      DB_PASSWORD: ${CATALOGO_DB_PASSWORD:-}

  ms-ventas:
    build:
      context: .
      args:
        MODULO: ms-ventas
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${PERFIL:-h2}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:3000,http://localhost:5173}
      DB_URL: ${VENTAS_DB_URL:-}
      DB_USER: ${VENTAS_DB_USER:-}
      DB_PASSWORD: ${VENTAS_DB_PASSWORD:-}
      CATALOGO_URL: http://ms-catalogo:8082

  ms-agenda:
    build:
      context: .
      args:
        MODULO: ms-agenda
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${PERFIL:-h2}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:3000,http://localhost:5173}
      DB_URL: ${AGENDA_DB_URL:-}
      DB_USER: ${AGENDA_DB_USER:-}
      DB_PASSWORD: ${AGENDA_DB_PASSWORD:-}
      CATALOGO_URL: http://ms-catalogo:8082
      USUARIOS_URL: http://ms-usuarios:8081

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ms-usuarios
      - ms-catalogo
      - ms-ventas
      - ms-agenda

volumes:
  mysql_data: