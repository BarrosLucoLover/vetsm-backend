# Levanta todo el backend con un solo comando:   docker compose up --build
# Gateway en http://localhost:8080  ·  Swagger en http://localhost:8080/swagger-ui.html
# En el servidor de AWS: ver desplegar/LEEME.md (el gateway también sirve el frontend, en el puerto 80).
#
# Por defecto cada servicio usa su propia base H2 en memoria (perfil h2). Para Oracle:
#   1. Descomprimir el wallet de la Autonomous Database dentro de la carpeta wallet/ (ver wallet/LEEME.md).
#   2. Copiar .env.example como .env y completar los datos (PERFIL=oracle).

name: vetsm

services:
  ms-usuarios:
    build:
      context: .
      args:
        MODULO: ms-usuarios
    restart: unless-stopped
    mem_limit: ${MEMORIA_SERVICIO:-768m}
    environment:
      SPRING_PROFILES_ACTIVE: ${PERFIL:-h2}
      TZ: America/Santiago
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_COOKIE_SEGURA: ${JWT_COOKIE_SEGURA:-false}
      ORACLE_SERVICIO: ${ORACLE_SERVICIO:-vetsm_tp}
      DB_USER: ${USUARIOS_DB_USER:-}
      DB_PASSWORD: ${USUARIOS_DB_PASSWORD:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_RECEPCION_PASSWORD: ${SEED_RECEPCION_PASSWORD:-}
      VENTAS_URL: http://ms-ventas:8083
      AGENDA_URL: http://ms-agenda:8084
    volumes:
      - ./wallet:/wallet:ro

  ms-catalogo:
    build:
      context: .
      args:
        MODULO: ms-catalogo
    restart: unless-stopped
    mem_limit: ${MEMORIA_SERVICIO:-768m}
    environment:
      SPRING_PROFILES_ACTIVE: ${PERFIL:-h2}
      TZ: America/Santiago
      JWT_SECRET: ${JWT_SECRET:-}
      ORACLE_SERVICIO: ${ORACLE_SERVICIO:-vetsm_tp}
      DB_USER: ${CATALOGO_DB_USER:-}
      DB_PASSWORD: ${CATALOGO_DB_PASSWORD:-}
    volumes:
      - ./wallet:/wallet:ro

  ms-ventas:
    build:
      context: .
      args:
        MODULO: ms-ventas
    restart: unless-stopped
    mem_limit: ${MEMORIA_SERVICIO:-768m}
    environment:
      SPRING_PROFILES_ACTIVE: ${PERFIL:-h2}
      TZ: America/Santiago
      JWT_SECRET: ${JWT_SECRET:-}
      ORACLE_SERVICIO: ${ORACLE_SERVICIO:-vetsm_tp}
      DB_USER: ${VENTAS_DB_USER:-}
      DB_PASSWORD: ${VENTAS_DB_PASSWORD:-}
      CATALOGO_URL: http://ms-catalogo:8082
    volumes:
      - ./wallet:/wallet:ro

  ms-agenda:
    build:
      context: .
      args:
        MODULO: ms-agenda
    restart: unless-stopped
    mem_limit: ${MEMORIA_SERVICIO:-768m}
    environment:
      SPRING_PROFILES_ACTIVE: ${PERFIL:-h2}
      TZ: America/Santiago
      JWT_SECRET: ${JWT_SECRET:-}
      ORACLE_SERVICIO: ${ORACLE_SERVICIO:-vetsm_tp}
      DB_USER: ${AGENDA_DB_USER:-}
      DB_PASSWORD: ${AGENDA_DB_PASSWORD:-}
      CATALOGO_URL: http://ms-catalogo:8082
      USUARIOS_URL: http://ms-usuarios:8081
    volumes:
      - ./wallet:/wallet:ro

  # Única puerta de entrada: es el único contenedor con un puerto publicado hacia afuera.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # En el servidor se usa PUERTO=80 para que el sitio abra sin escribir el puerto.
      - "${PUERTO:-8080}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Frontend compilado (carpeta dist). En desarrollo, una página que explica cómo abrir el sitio.
      - ${SITIO_WEB:-./gateway/sin-frontend}:/usr/share/nginx/html:ro
    depends_on:
      - ms-usuarios
      - ms-catalogo
      - ms-ventas
      - ms-agenda
