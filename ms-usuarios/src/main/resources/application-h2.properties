# ---------- Perfil "h2": desarrollo local y pruebas ----------
# Base en memoria PROPIA de este servicio, en modo compatible con Oracle. Se borra al apagarlo.
spring.datasource.url=jdbc:h2:mem:usuarios;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola web de H2 en http://localhost:8081/h2-console (solo en este perfil).
spring.h2.console.enabled=true

# Secreto de DESARROLLO para los JWT; debe ser el mismo en los cuatro servicios.
# En el perfil "oracle" se usa la variable JWT_SECRET.
app.jwt.secreto=solo-para-desarrollo-local-cambiar-en-produccion-2026

# Contraseñas de las cuentas de DEMOSTRACIÓN. Solo sirven para esta base en memoria:
# en el perfil "oracle" se entregan por variables de entorno y nunca se suben al repositorio.
app.seed.admin-password=Admin123!
app.seed.recepcion-password=Recep123!
app.seed.cliente-demo-password=Cliente123!
