spring.application.name=ms-usuarios
# Puerto propio de este microservicio. En Docker todos quedan detrás del gateway (puerto 8080).
server.port=${PORT:8081}

# Perfil por defecto: H2 en memoria (una base propia para este servicio).
# Con Oracle: SPRING_PROFILES_ACTIVE=oracle (ver application-oracle.properties y .env.example).
spring.profiles.default=h2

# Las consultas a la base se hacen dentro de los servicios, no al armar la respuesta JSON.
spring.jpa.open-in-view=false

# Hora de Chile (el servidor en la nube suele estar en UTC).
app.zona-horaria=America/Santiago

# ---------- JWT ----------
# Todos los servicios verifican el mismo token: mismo emisor y mismo secreto (app.jwt.secreto, por perfil).
app.jwt.emisor=vetsm-backend
# El token de acceso dura poco: si lo roban, sirve por pocos minutos.
app.jwt.minutos-acceso=15
# El token de renovación (cookie HttpOnly) mantiene la sesión abierta hasta 7 días.
app.jwt.dias-renovacion=7
# Si un token de renovación ya usado reaparece antes de estos segundos, se toma como dos pestañas
# renovando a la vez (no como un robo): se rechaza sin cerrar las demás sesiones.
app.jwt.segundos-gracia=10
# true solo cuando el sitio funcione con HTTPS (la cookie Secure no viaja por HTTP).
app.jwt.cookie-segura=${JWT_COOKIE_SEGURA:false}

# ---------- CORS (solo para llamadas directas; el navegador normalmente pasa por el gateway) ----------
app.cors.origenes=${CORS_ORIGENES:http://localhost:3000,http://localhost:5173}

# ---------- Otros microservicios que llama este servicio ----------
app.servicios.ventas=${VENTAS_URL:http://localhost:8083}
app.servicios.agenda=${AGENDA_URL:http://localhost:8084}

# ---------- Swagger / OpenAPI ----------
# Por el gateway: http://localhost:8080/swagger-ui.html (todos los servicios en una página).
# Directo: http://localhost:8081/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs/usuarios
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json
# Solo se documenta la API pública; los endpoints internos (/internal/...) no aparecen.
springdoc.paths-to-match=/api/**
app.documentacion.titulo=ms-usuarios: cuentas y sesión
app.documentacion.descripcion=Cuentas de usuario, inicio de sesión con JWT (este servicio **emite** los tokens), renovación de sesión y perfil (Mi cuenta).
# Swagger UI se publica desde este servicio con un selector para ver la documentación de los cuatro.
springdoc.swagger-ui.urls[0].name=ms-usuarios
springdoc.swagger-ui.urls[0].url=/v3/api-docs/usuarios
springdoc.swagger-ui.urls[1].name=ms-catalogo
springdoc.swagger-ui.urls[1].url=/v3/api-docs/catalogo
springdoc.swagger-ui.urls[2].name=ms-ventas
springdoc.swagger-ui.urls[2].url=/v3/api-docs/ventas
springdoc.swagger-ui.urls[3].name=ms-agenda
springdoc.swagger-ui.urls[3].url=/v3/api-docs/agenda
springdoc.swagger-ui.urls-primary-name=ms-usuarios
